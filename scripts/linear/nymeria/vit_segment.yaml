defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "pascalvoc_mocov3"

backbone:
  name: "vit_base"
  kwargs:
    dynamic_img_size: True
method: "mocov3"
data:
  dataset: PascalVOC
  train_path: "/scratch_shared/aubret/pascalvoc"
  val_path: "/scratch_shared/aubret/pascalvoc"
  num_workers: 4
  augmentations:
    img_size: 224
optimizer:
  name: "sgd"
  batch_size: 64
  lr: 0.3
  momentum: 0.9
  weight_decay: 0.001
  evalmode: False
scheduler:
  name: "step"
  lr_decay_steps: [60, 80]
checkpoint:
  enabled: True
  dir: "/scratch_shared/aubret/trained_models2"
  frequency: 1
  keep_prev: False
  save_last: True
auto_resume:
  enabled: False
early_stopping:
  enabled: False

grid:
  enabled: True
  lr: [0.01,0.03, 0.1, 0.3, 1, 3]
  layer_names: [ "norm"]
  use_avgpool: None
  use_cls_token: None
  use_n_blocks: [ 1 ]
  depth: -1
use_projector: False
pre_extract_feats: False

# overwrite PL stuff
max_epochs: 100
devices: 4
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
finetune: False
log_every_n_steps: 50
precision: 16-mixed
