defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "sintel_mocov3"

backbone:
  name: "resnet50"
method: "mocov3"
data:
  dataset: Davis
  train_path: "/scratch_shared/aubret/"
  val_path: "/scratch_shared/aubret/"
  num_workers: 4
optimizer:
  name: "sgd"
  batch_size: 32
  lr: 3
  momentum: 0.9
  weight_decay: 0
scheduler:
  name: "step"
  lr_decay_steps: [60, 80]
checkpoint:
  enabled: True
  dir: "/scratch_shared/aubret/trained_models2"
  frequency: 1
  keep_prev: False
  save_last: True
auto_resume:
  enabled: False
early_stopping:
  enabled: False

grid:
  enabled: False
  lr: [0.003, 0.01, 0.03, 0.1, 0.3, 1, 3]
  layer_names: ["layer4","layer3","layer2"]
  use_avgpool: None
  use_cls_token: None
  use_n_blocks: [1]
use_projector: False
pre_extract_feats: False
finetune: False
classifier_mode: fcn

# overwrite PL stuff
max_epochs: 100
devices: 4
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 32
log_every_n_steps: 50
