defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "imagenet_mocov3"

backbone:
  name: "resnet50"
method: "mocov3"
data:
  dataset: NYUv2
  train_path: "/scratch_shared/aubret/nyudepthv2/train/"
  val_path: "/scratch_shared/aubret/nyudepthv2/val/"
  num_workers: 4
optimizer:
  name: "sgd"
  batch_size: 64
  lr: 0.1
  weight_decay: 0.001
scheduler:
  name: "step"
  lr_decay_steps: [30, 35]
checkpoint:
  enabled: True
  dir: "/scratch_shared/aubret/trained_models2"
  frequency: 1
  keep_prev: False
  save_last: True
auto_resume:
  enabled: False
early_stopping:
  enabled: False

grid:
  enabled: False
  lr: [0.003, 0.01, 0.03, 0.1, 0.3, 1, 3]
  layer_names: ["layer4","layer3","layer2"]
  use_avgpool: None
  use_cls_token: None
  use_n_blocks: [1]
  depth: 4
use_projector: False
pre_extract_feats: False
finetune: True
classifier_mode: fcrn
evalmode: True


# overwrite PL stuff
max_epochs: 40
devices: 4
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 32
log_every_n_steps: 50
