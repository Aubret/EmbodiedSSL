defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "mvimagenet_mocov3"

backbone:
  name: "resnet50"
method: "mocov3"
data:
  dataset: mvimgnet2
  train_path: "/work/autolearn/aubret/mvimgnet/"
  val_path: "/work/autolearn/aubret/mvimgnet/"
  num_workers: 8
optimizer:
  name: "sgd"
  batch_size: 64
  lr: 0.3
  weight_decay: 1e-6
scheduler:
  name: "step"
  lr_decay_steps: [15, 18]
checkpoint:
  enabled: True
  dir: "/work/autolearn/aubret/trained_models_nymeria/"
  frequency: 1
  keep_prev: False
  save_last: True
auto_resume:
  enabled: False
early_stopping:
  enabled: False

grid:
  enabled: True
  lr: [0.001, 0.003,0.01,0.03,0.1,0.2]
  layer_names: ["backbone"]
  use_avgpool: [ True ]
  use_cls_token: [ True ]
  use_n_blocks: [ 1 ]
  depth: 5

aug_kwargs:
  rescale: [0.5,0.5]
use_projector: False
pre_extract_feats: False
finetune: False

# overwrite PL stuff
max_epochs: 20
devices: 8
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 32
log_every_n_steps: 50
