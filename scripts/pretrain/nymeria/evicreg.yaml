defaults:
  - _self_
  - augmentations: symmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "evicreg-nymeria"
method: "aavicreg"
backbone:
  name: "resnet50"
method_kwargs:
  proj_hidden_dim: 4096
  proj_output_dim: 2048
  sim_loss_weight: 10.0
  var_loss_weight: 10.0
  cov_loss_weight: 1.0
  aa_weight: 0.1
  layers: 4
  aa_layers: 4
data:
  dataset: nymeria
  train_path: "/home/aubret/nymeria_dataset/"
  val_path: None
  format: "h5"
  num_workers: 4
  same_augmentations: True
  dataset_kwargs:
    gaze_size: 224
    time_window: 25
    resolution: 512
    fps: 5
optimizer:
  name: "lars"
  batch_size: 128
  lr: 1.6
  classifier_lr: 3e-3
  weight_decay: 1e-6
  no_labels: True
scheduler:
  name: "warmup_cosine"
  warmup_epochs: 1
checkpoint:
  enabled: True
  dir: "/scratch_shared/aubret/trained_models2"
  frequency: 1
  keep_prev: False
  save_last: True
auto_resume:
  enabled: True

knn_clb:
  enabled: False
  verbose: True
  dataset: imagenet100_im
  k:
    - 10
    - 20
    - 50
    - 100
  perform_on_validation: True
  val_path: /home/aubret/
  train_path: /home/aubret/
  format: h5
  delay_epochs: 1
  freq_epochs: 1

# overwrite PL stuff
max_epochs: 20
devices: 4
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16-mixed
no_validation: True
limit_val_batches: 0
num_sanity_val_steps: 0
log_every_n_steps: 50